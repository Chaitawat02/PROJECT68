<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AR Scan - ผ้าไหม</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,'Noto Sans Thai',sans-serif;margin:0;padding:0}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;padding:16px}
    .card{background:#fff;border:1px solid #e6e6e6;border-radius:8px;overflow:hidden;cursor:pointer}
    .card img{width:100%;height:160px;object-fit:cover}
    .card .meta{padding:8px}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;padding:18px}
    .modal .sheet{background:#fff;border-radius:8px;max-width:980px;width:100%;max-height:90vh;overflow:auto}
    .sheet .header{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid #eee}
    .sheet .body{display:flex;gap:12px;padding:12px}
    .viewer-wrap{flex:1;min-width:320px}
    model-viewer{width:100%;height:480px;background:#f3f3f3}
    .info{width:360px;max-width:40%;overflow:auto}
    .info h3{margin:0 0 8px}
    .close-btn{background:#eee;border:0;padding:8px 12px;border-radius:6px;cursor:pointer}
    @media(max-width:900px){.sheet .body{flex-direction:column}.info{width:auto;max-width:none}}
  </style>
</head>
<body>
  <h2 style="padding:12px 16px;margin:0;background:#fafafa;border-bottom:1px solid #eee">AR Scan — คลังผ้าไหม</h2>

  <div class="grid" id="grid"></div>

  <div id="modal" class="modal" role="dialog" aria-hidden="true">
    <div class="sheet">
      <div class="header">
        <strong id="modal-title">รายละเอียดผ้า</strong>
        <div>
          <button id="open-detail" class="close-btn">ดูรายละเอียด</button>
          <button id="close" class="close-btn">ปิด</button>
        </div>
      </div>
      <div class="body">
        <div class="viewer-wrap">
          <model-viewer id="mv" alt="3D model" camera-controls autoplay ar ar-modes="webxr scene-viewer quick-look" environment-image="https://modelviewer.dev/shared-assets/environments/venice_sunset_1k.hdr" exposure="1" shadow-intensity="1"></model-viewer>
        </div>
        <div class="info">
          <h3 id="name">-</h3>
          <p><strong>รหัส:</strong> <span id="siid">-</span></p>
          <p><strong>แหล่งผลิต:</strong> <span id="address">-</span></p>
          <p><strong>ชนิด:</strong> <span id="type">-</span></p>
          <p><strong>สี:</strong> <span id="color">-</span></p>
          <h4>ประวัติ / ที่มา</h4>
          <div id="history" style="white-space:pre-wrap;color:#333"></div>
          <p style="margin-top:12px"><strong>รูปอ้างอิง:</strong></p>
          <img id="refimg" src="" alt="reference" style="width:100%;border-radius:6px;border:1px solid #eee" />
        </div>
      </div>
    </div>
  </div>

  <script>
    const silkData = {{ silk_json|safe }};

    const grid = document.getElementById('grid');
    const modal = document.getElementById('modal');
    const mv = document.getElementById('mv');

    function createCard(item){
      const el = document.createElement('div'); el.className='card';
      const img = document.createElement('img'); img.src = item.image_url || '/static/main/img/placeholder.png';
      const meta = document.createElement('div'); meta.className='meta';
      meta.innerHTML = `<strong>${item.name}</strong><div style="font-size:13px;color:#666;margin-top:6px">${item.address || ''}</div>`;
      el.appendChild(img); el.appendChild(meta);
      el.addEventListener('click', ()=>openModal(item));
      return el;
    }

    function openModal(item){
      document.getElementById('modal-title').textContent = item.name || 'ผ้าไหม';
      document.getElementById('name').textContent = item.name || '-';
      document.getElementById('siid').textContent = item.Si_ID || '-';
      document.getElementById('address').textContent = item.address || '-';
      document.getElementById('type').textContent = item.type || '-';
      document.getElementById('color').textContent = item.color || '-';
      document.getElementById('history').textContent = item.history || '-';
      document.getElementById('refimg').src = item.image_url || '';

      if(item.model_url){
        mv.src = item.model_url;
        mv.setAttribute('ios-src', item.model_url);
      } else {
        // no model — show image as fallback
        mv.removeAttribute('src');
        mv.style.background = '#fff url(' + (item.image_url || '') + ') center/contain no-repeat';
      }

      modal.style.display='flex'; modal.setAttribute('aria-hidden','false');
    }

    document.getElementById('close').addEventListener('click', ()=>{ modal.style.display='none'; modal.setAttribute('aria-hidden','true'); });
    document.getElementById('open-detail').addEventListener('click', ()=>{ const url = silkData[activeIndex].detail_url; if(url) window.open(url,'_blank'); });

    // build grid
    let activeIndex = 0;
    silkData.forEach((s, idx)=>{
      const c = createCard(s); grid.appendChild(c);
      c.addEventListener('click', ()=> activeIndex = idx);
    });
  </script>
</body>
</html>
