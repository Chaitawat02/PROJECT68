{% extends 'main/base.html' %}
{% load static %}

{% block title %}{{ title }} | Admin Panel{% endblock %}

{% block content %}
<div class="flex flex-col lg:flex-row gap-8 py-8 fade-in bg-gray-50/50 min-h-screen">
    
    <aside class="w-full lg:w-1/4 xl:w-1/5 shrink-0 px-4 lg:px-0">
        {% include 'admin_panel/admin_dashboard.html' %}
    </aside>

    <main class="w-full lg:w-3/4 xl:w-4/5 pr-4 lg:pr-8">
        <div class="max-w-4xl">
            <nav class="flex text-xs text-gray-400 uppercase tracking-wider mb-2">
                <ol class="list-none p-0 inline-flex">
                    <li class="flex items-center">
                        <a href="{% url 'admin_dashboard' %}" class="hover:text-amber-600">Dashboard</a>
                        <i class="fas fa-chevron-right mx-2 text-[10px]"></i>
                    </li>
                    <li class="flex items-center">
                        <a href="{% url 'admin_events_list' %}" class="hover:text-amber-600">จัดการกิจกรรม</a>
                        <i class="fas fa-chevron-right mx-2 text-[10px]"></i>
                    </li>
                    <li class="text-amber-600 font-bold">{{ title }}</li>
                </ol>
            </nav>
            
            <h2 class="text-3xl font-black text-gray-800 mb-8 flex items-center gap-3">
                <i class="fas {% if workshop %}fa-edit{% else %}fa-plus-circle{% endif %} text-[#8B0000]"></i>
                {{ title }}
            </h2>

            <div class="bg-white rounded-[2.5rem] shadow-xl shadow-gray-200/50 border border-gray-100 overflow-hidden">
                <form method="POST" enctype="multipart/form-data" class="p-8 lg:p-12 space-y-8">
                    {% csrf_token %}
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        
                        <div class="md:col-span-2 space-y-4">
                            <label class="text-sm font-black text-gray-700 uppercase tracking-wide ml-1">รูปภาพหน้าปกกิจกรรม</label>
                            <div class="flex items-center justify-center w-full">
                                <label for="image-upload" class="flex flex-col items-center justify-center w-full h-64 border-2 border-dashed border-gray-300 rounded-[2rem] cursor-pointer bg-gray-50 hover:bg-gray-100 transition-all relative overflow-hidden group">
                                    <div class="flex flex-col items-center justify-center pt-5 pb-6 {% if workshop.image %}opacity-0{% endif %}" id="upload-placeholder">
                                        <i class="fas fa-image text-4xl text-gray-400 mb-3 group-hover:scale-110 transition-transform"></i>
                                        <p class="mb-2 text-sm text-gray-500 font-bold">คลิกเพื่ออัปโหลดรูปภาพ</p>
                                        <p class="text-xs text-gray-400">แนะนำขนาด 1200x600px (JPG, PNG)</p>
                                    </div>
                                    <img id="image-preview" src="{% if workshop.image %}{{ workshop.image.url }}{% endif %}" 
                                         class="absolute inset-0 w-full h-full object-cover {% if not workshop.image %}hidden{% endif %}">
                                    <input id="image-upload" type="file" name="image" class="hidden" accept="image/*" onchange="previewImage(this)">
                                </label>
                            </div>
                        </div>

                        <div class="md:col-span-2 space-y-2">
                            <label class="text-sm font-black text-gray-700 uppercase tracking-wide ml-1">ชื่อกิจกรรม</label>
                            <input type="text" name="title" value="{{ workshop.title|default:'' }}" required
                                class="w-full px-6 py-4 rounded-2xl bg-gray-50 border-2 border-transparent focus:border-amber-500 focus:bg-white transition-all outline-none font-medium"
                                placeholder="เช่น เวิร์กชอปทอผ้าไหมมัดหมี่">
                        </div>

                        <div class="md:col-span-2 space-y-2">
                            <label class="text-sm font-black text-gray-700 uppercase tracking-wide ml-1">รายละเอียด</label>
                            <textarea name="description" rows="4"
                                class="w-full px-6 py-4 rounded-2xl bg-gray-50 border-2 border-transparent focus:border-amber-500 focus:bg-white transition-all outline-none font-medium"
                                placeholder="รายละเอียดกิจกรรม...">{{ workshop.description|default:'' }}</textarea>
                        </div>

                        <div class="space-y-2">
                            <label class="text-sm font-black text-gray-700 uppercase tracking-wide ml-1">วันที่เริ่มกิจกรรม</label>
                            <input type="date" name="start_date" value="{{ workshop.start_date|date:'Y-m-d' }}"
                                class="w-full px-6 py-4 rounded-2xl bg-gray-50 border-2 border-transparent focus:border-amber-500 focus:bg-white transition-all outline-none font-medium">
                        </div>
                        <div class="space-y-2">
                            <label class="text-sm font-black text-gray-700 uppercase tracking-wide ml-1">วันที่สิ้นสุดกิจกรรม</label>
                            <input type="date" name="end_date" value="{{ workshop.end_date|date:'Y-m-d' }}"
                                class="w-full px-6 py-4 rounded-2xl bg-gray-50 border-2 border-transparent focus:border-amber-500 focus:bg-white transition-all outline-none font-medium">
                        </div>

                        <div class="space-y-2">
                            <label class="text-sm font-black text-gray-700 uppercase tracking-wide ml-1">เวลาเริ่ม</label>
                            <input type="time" name="start_time" value="{{ workshop.start_time|time:'H:i' }}"
                                class="w-full px-6 py-4 rounded-2xl bg-gray-50 border-2 border-transparent focus:border-amber-500 focus:bg-white transition-all outline-none font-medium">
                        </div>
                        <div class="space-y-2">
                            <label class="text-sm font-black text-gray-700 uppercase tracking-wide ml-1">เวลาสิ้นสุด</label>
                            <input type="time" name="end_time" value="{{ workshop.end_time|time:'H:i' }}"
                                class="w-full px-6 py-4 rounded-2xl bg-gray-50 border-2 border-transparent focus:border-amber-500 focus:bg-white transition-all outline-none font-medium">
                        </div>

                        <div class="space-y-2">
                            <label class="text-sm font-black text-gray-700 uppercase tracking-wide ml-1">สถานที่</label>
                            <input type="text" name="location" value="{{ workshop.location|default:'' }}"
                                class="w-full px-6 py-4 rounded-2xl bg-gray-50 border-2 border-transparent focus:border-amber-500 focus:bg-white transition-all outline-none font-medium"
                                placeholder="เช่น อาคารเรียนรู้ ชั้น 1">
                        </div>
                        <div class="space-y-2">
                            <label class="text-sm font-black text-gray-700 uppercase tracking-wide ml-1">ระยะเวลารวม (Duration)</label>
                            <input type="text" name="duration" value="{{ workshop.duration|default:'' }}"
                                class="w-full px-6 py-4 rounded-2xl bg-gray-50 border-2 border-transparent focus:border-amber-500 focus:bg-white transition-all outline-none font-medium"
                                placeholder="เช่น 3 ชม. หรือ 2 วัน">
                        </div>

                        <div class="space-y-2">
                            <label class="text-sm font-black text-gray-700 uppercase tracking-wide ml-1">รับจำนวนจำกัด (ที่นั่ง)</label>
                            <input type="number" name="max_participants" value="{{ workshop.max_participants|default:20 }}"
                                class="w-full px-6 py-4 rounded-2xl bg-gray-50 border-2 border-transparent focus:border-amber-500 focus:bg-white transition-all outline-none font-medium">
                        </div>
                        <div class="space-y-2 md:col-span-2">
                            <div class="flex items-center px-4">
                                <label class="relative inline-flex items-center cursor-pointer">
                                    <input type="checkbox" name="is_active" class="sr-only peer" {% if workshop.is_active != False %}checked{% endif %}>
                                    <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-amber-600"></div>
                                    <span class="ml-3 text-sm font-bold text-gray-700 uppercase">เปิดให้จองกิจกรรม</span>
                                </label>
                            </div>
                            <div class="px-4 mt-2">
                                <label class="text-xs font-semibold text-gray-600 block mb-1">เหตุผลเมื่อปิดกิจกรรม (แสดงสำหรับผู้ดูแลระบบ)</label>
                                <input type="text" name="inactive_reason" value="{{ workshop.inactive_reason|default:'' }}"
                                       class="w-full px-4 py-2 rounded-xl bg-gray-50 border border-gray-200 focus:border-amber-500 focus:bg-white text-sm outline-none"
                                       placeholder="เช่น วัสดุอุปกรณ์ไม่เพียงพอ / ปิดปรับปรุง / เต็มแล้ว">
                            </div>
                        </div>
                    </div>

                    <div class="pt-8 border-t border-gray-100 flex flex-col sm:flex-row gap-4">
                        <button type="submit" class="flex-1 bg-gradient-to-r from-[#8B0000] to-[#5e0000] text-white py-4 rounded-2xl font-black text-lg shadow-lg shadow-red-900/20 hover:shadow-xl hover:-translate-y-1 transition-all duration-300">
                            <i class="fas fa-save mr-2"></i> บันทึกข้อมูลกิจกรรม
                        </button>
                        <a href="{% url 'admin_events_list' %}" class="sm:w-1/3 text-center bg-gray-100 text-gray-600 py-4 rounded-2xl font-bold hover:bg-gray-200 transition-all">
                            ยกเลิก
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
{% endblock %}
