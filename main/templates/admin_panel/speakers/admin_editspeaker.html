{% extends 'main/base.html' %}
{% load static %}

{% block title %}แก้ไขข้อมูลวิทยากร - Admin Panel{% endblock %}

{% block content %}
<div class="flex flex-col lg:flex-row gap-8 py-6 fade-in">
    
    <aside class="w-full lg:w-1/4 xl:w-1/5 shrink-0">
        {% include 'admin_panel/admin_dashboard.html' %}
    </aside>

    <main class="w-full lg:w-3/4 xl:w-4/5 space-y-6">
        
        <div class="border-b border-gray-200 pb-4">
            <h2 class="text-3xl font-bold text-gray-800">แก้ไขข้อมูลวิทยากร</h2>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <form method="POST" enctype="multipart/form-data" class="p-6 space-y-6">
                {% csrf_token %}

                <div class="flex items-center gap-6">
                    <div class="shrink-0">
                        {% if speaker.profile_picture %}
                            <img src="{{ speaker.profile_picture.url }}" class="w-24 h-24 rounded-full object-cover border-4 border-gray-100 shadow-md">
                        {% else %}
                            <div class="w-24 h-24 rounded-full bg-gray-200 flex items-center justify-center text-gray-400 text-3xl">
                                <i class="fas fa-user-tie"></i>
                            </div>
                        {% endif %}
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">รูปประจำตัววิทยากร</label>
                        <input type="file" name="profile_picture" accept="image/*" class="text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-amber-50 file:text-amber-700 hover:file:bg-amber-100">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">ชื่อ-นามสกุล</label>
                    <input type="text" name="name" value="{{ speaker.name }}" required
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-transparent outline-none transition-all">
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">ความเชี่ยวชาญ (Expertise)</label>
                    <input type="text" name="expertise" value="{{ speaker.expertise }}" placeholder="เช่น การย้อมสีธรรมชาติ, การทอผ้าไหมมัดหมี่"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-transparent outline-none transition-all">
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">ประวัติโดยย่อ (Biography)</label>
                    <textarea name="biography" rows="5" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-transparent outline-none transition-all">{{ speaker.biography }}</textarea>
                </div>

                <div class="flex gap-3 pt-4">
                    <button type="submit" class="bg-[#8B0000] hover:bg-[#6d0000] text-white px-6 py-2.5 rounded-lg shadow-md transition-all font-medium">
                        <i class="fas fa-save mr-2"></i> บันทึกข้อมูล
                    </button>
                    <a href="{% url 'manage_users' %}" class="bg-gray-100 text-gray-700 px-6 py-2.5 rounded-lg hover:bg-gray-200 transition-all font-medium">
                        ยกเลิก
                    </a>
                </div>
            </form>
        </div>
    </main>
</div>
{% endblock %}
