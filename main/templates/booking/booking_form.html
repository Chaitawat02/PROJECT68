<form method="post" class="space-y-4">
    {% csrf_token %}
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
            <label class="block text-sm font-medium text-gray-700">ชื่อ-นามสกุล</label>
            {{ form.fullname }}
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700">อีเมล</label>
            {{ form.email }}
        </div>
    </div>
    
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
            <label class="block text-sm font-medium text-gray-700">เวลาเข้าชม</label>
            {{ form.check_in }}
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700">จำนวนผู้เข้าชม</label>
            {{ form.Re_quantity }}
        </div>
    </div>

    <div class="mt-6">
        <h4 class="font-bold text-gray-800 mb-3">เลือกกิจกรรม Workshop (ถ้ามี)</h4>
        <div class="grid grid-cols-1 gap-3">
            {% for workshop in workshops %}
            <label class="flex items-center p-3 border rounded-lg hover:bg-amber-50 cursor-pointer transition">
                <input type="checkbox" name="activity_type" value="workshop_{{ workshop.id }}" 
                       class="w-4 h-4 text-amber-600 focus:ring-amber-500 border-gray-300 rounded"
                       {% if preselect_workshop and preselect_workshop.id == workshop.id %}checked{% endif %}>
                <div class="ml-3">
                    <span class="block font-medium text-gray-900">{{ workshop.workshop_name }}</span>
                    <span class="text-xs text-gray-500">{{ workshop.date|date:"d M Y" }}</span>
                </div>
            </label>
            {% endfor %}
        </div>
    </div>

    <button type="submit" class="w-full bg-amber-600 text-white py-3 rounded-xl font-bold hover:bg-amber-700 transition shadow-lg mt-6">
        ยืนยันการจอง
    </button>
</form>
