{% extends 'main/base.html' %}
{% block content %}
<div class="max-w-2xl mx-auto py-12 px-4 text-center">
    <div class="bg-white rounded-2xl p-8 shadow">
        <h2 class="text-2xl font-bold text-amber-600 mb-4">ขอบคุณสำหรับคำตอบ</h2>
        <p class="text-gray-600 mb-4">คำตอบของคุณถูกบันทึกแล้ว เราจะนำไปใช้ปรับปรุงบริการ</p>
        <p class="text-xs text-gray-400 mb-4">ถ้าต้องการแชร์แบบประเมินให้ผู้อื่นสามารถสแกนได้จาก QR นี้</p>
        <img src="{{ qr_data }}" alt="QR" />
        <div class="mt-6">
            <a href="{% url 'booking_history' %}" class="px-4 py-2 bg-amber-600 text-white rounded">ไปที่ประวัติการจอง</a>
        </div>
    </div>
</div>
{% endblock %}
