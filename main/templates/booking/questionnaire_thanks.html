{% extends 'main/base.html' %}
{% block content %}
<div class="max-w-2xl mx-auto py-12 px-4 text-center">
    <div class="bg-white rounded-3xl p-10 shadow-lg border border-amber-50">
        <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-amber-100 flex items-center justify-center text-amber-600">
            <i class="fas fa-check text-2xl"></i>
        </div>
        <h2 class="text-2xl font-bold text-amber-700 mb-3">ขอบคุณสำหรับคำตอบของคุณ</h2>
        <p class="text-gray-600 mb-2">
            ระบบได้บันทึกแบบประเมินเรียบร้อยแล้ว
        </p>
        <p class="text-gray-500 text-sm mb-6">
            ความเห็นของคุณมีคุณค่าต่อการพัฒนาการให้บริการของพิพิธภัณฑ์อย่างมาก
        </p>

        <div class="mt-4 flex flex-col sm:flex-row gap-3 justify-center">
            <a href="{% url 'user_dashboard' %}"
               class="px-6 py-2.5 bg-amber-600 hover:bg-amber-700 text-white rounded-xl text-sm font-medium shadow-sm">
                กลับไปที่ประวัติการจอง
            </a>
            <a href="{% url 'home' %}"
               class="px-6 py-2.5 border border-gray-200 hover:bg-gray-50 rounded-xl text-sm font-medium text-gray-700">
                กลับสู่หน้าแรก
            </a>
        </div>
    </div>
</div>
{% endblock %}
