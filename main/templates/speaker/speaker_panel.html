{% load static %}

<div class="bg-white rounded-2xl shadow-lg border border-gray-100 overflow-hidden transition-all duration-300">
  <!-- Header -->
  <div class="bg-gradient-to-br from-amber-900 to-amber-700 p-6 text-center text-white relative overflow-hidden">
    <div class="absolute top-0 right-0 -mr-6 -mt-6 w-24 h-24 rounded-full bg-white/10 blur-xl"></div>
    <div class="absolute bottom-0 left-0 -ml-6 -mb-6 w-20 h-20 rounded-full bg-white/10 blur-xl"></div>

    <div class="relative z-10">
      <div class="w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center mx-auto mb-3 backdrop-blur-sm">
        <i class="fas fa-chalkboard-user text-2xl"></i>
      </div>
      <h5 class="font-extrabold text-lg tracking-wide">เมนูวิทยากร</h5>
      <p class="text-xs text-amber-100/80 font-medium mt-1">ระบบจัดการงานวิทยากร</p>
    </div>
  </div>

  <!-- Nav -->
  <nav class="flex flex-col p-3 space-y-1.5 bg-white">

    <!-- Jump to top -->
    <a href="#top"
       class="group flex items-center px-4 py-3 rounded-xl transition-all duration-200 font-semibold text-sm
              text-gray-600 hover:bg-gray-50 hover:text-amber-800 hover:pl-5">
      <span class="w-8 flex justify-center mr-2 transition-transform group-hover:scale-110">
        <i class="fas fa-chart-pie text-lg text-gray-400 group-hover:text-amber-600"></i>
      </span>
      ภาพรวม
    </a>

    <!-- Tabs: use data-tab-nav (จะให้สคริปต์ด้านล่างยิงไปกดปุ่มแท็บหลัก) -->
    <a href="javascript:void(0)" data-tab-nav="pending"
       class="group flex items-center px-4 py-3 rounded-xl transition-all duration-200 font-semibold text-sm
              text-gray-600 hover:bg-gray-50 hover:text-amber-800 hover:pl-5">
      <span class="w-8 flex justify-center mr-2 transition-transform group-hover:scale-110">
        <i class="fas fa-inbox text-lg text-gray-400 group-hover:text-amber-600"></i>
      </span>
      รับงาน
      <span class="ml-auto text-[11px] font-black px-2 py-0.5 rounded-full
                   {% if pending_assignments.count > 0 %}bg-amber-100 text-amber-800{% else %}bg-gray-100 text-gray-500{% endif %}">
        {{ pending_assignments.count }}
      </span>
    </a>

    <a href="javascript:void(0)" data-tab-nav="accepted"
       class="group flex items-center px-4 py-3 rounded-xl transition-all duration-200 font-semibold text-sm
              text-gray-600 hover:bg-gray-50 hover:text-blue-800 hover:pl-5">
      <span class="w-8 flex justify-center mr-2 transition-transform group-hover:scale-110">
        <i class="fas fa-person-chalkboard text-lg text-gray-400 group-hover:text-blue-600"></i>
      </span>
      ปิดงาน
      <span class="ml-auto text-[11px] font-black px-2 py-0.5 rounded-full
                   {% if accepted_assignments.count > 0 %}bg-blue-100 text-blue-700{% else %}bg-gray-100 text-gray-500{% endif %}">
        {{ accepted_assignments.count }}
      </span>
    </a>

    <a href="javascript:void(0)" data-tab-nav="completed"
       class="group flex items-center px-4 py-3 rounded-xl transition-all duration-200 font-semibold text-sm
              text-gray-600 hover:bg-gray-50 hover:text-emerald-800 hover:pl-5">
      <span class="w-8 flex justify-center mr-2 transition-transform group-hover:scale-110">
        <i class="fas fa-circle-check text-lg text-gray-400 group-hover:text-emerald-600"></i>
      </span>
      ประวัติงาน
      <span class="ml-auto text-[11px] font-black px-2 py-0.5 rounded-full
                   {% if completed_assignments.count > 0 %}bg-emerald-100 text-emerald-700{% else %}bg-gray-100 text-gray-500{% endif %}">
        {{ completed_assignments.count }}
      </span>
    </a>

    <!-- ✅ เพิ่ม: Rejected -->
    <a href="javascript:void(0)" data-tab-nav="rejected"
       class="group flex items-center px-4 py-3 rounded-xl transition-all duration-200 font-semibold text-sm
              text-gray-600 hover:bg-gray-50 hover:text-red-700 hover:pl-5">
      <span class="w-8 flex justify-center mr-2 transition-transform group-hover:scale-110">
        <i class="fas fa-ban text-lg text-gray-400 group-hover:text-red-600"></i>
      </span>
      งานที่ปฏิเสธ
      <span class="ml-auto text-[11px] font-black px-2 py-0.5 rounded-full
                   {% if rejected_assignments.count|default:0 > 0 %}bg-red-100 text-red-700{% else %}bg-gray-100 text-gray-500{% endif %}">
        {{ rejected_assignments.count|default:0 }}
      </span>
    </a>


    <!-- upload -->
    <a href="javascript:void(0)" data-tab-nav="upload"
       class="group flex items-center px-4 py-3 rounded-xl transition-all duration-200 font-semibold text-sm
              text-gray-600 hover:bg-gray-50 hover:text-gray-800 hover:pl-5">
      <span class="w-8 flex justify-center mr-2 transition-transform group-hover:scale-110">
        <i class="fas fa-cloud-arrow-up text-lg text-gray-400 group-hover:text-gray-700"></i>
      </span>
      อัปโหลดงาน
    </a>


    <!-- report -->
    <a href="javascript:void(0)" data-tab-nav="report"
       class="group flex items-center px-4 py-3 rounded-xl transition-all duration-200 font-semibold text-sm
              text-gray-600 hover:bg-gray-50 hover:text-gray-800 hover:pl-5">
      <span class="w-8 flex justify-center mr-2 transition-transform group-hover:scale-110">
        <i class="fas fa-file-lines text-lg text-gray-400 group-hover:text-gray-700"></i>
      </span>
      รายงาน
    </a>


    <div class="border-t border-gray-100 my-2 mx-2"></div>

    <!-- Links -->
    <a href="{% url 'speaker_edit_view' speaker.id %}"
       class="group flex items-center px-4 py-3 rounded-xl transition-all duration-200 font-semibold text-sm
              text-gray-600 hover:bg-gray-50 hover:text-amber-800 hover:pl-5">
      <span class="w-8 flex justify-center mr-2 transition-transform group-hover:scale-110">
        <i class="fas fa-user-gear text-lg text-gray-400 group-hover:text-amber-600"></i>
      </span>
      จัดการโปรไฟล์
    </a>

    <a href="{% url 'home' %}"
       class="group flex items-center px-4 py-3 rounded-xl text-gray-500 hover:bg-red-50 hover:text-red-600 transition-all duration-200 text-sm font-semibold">
      <span class="w-8 flex justify-center mr-2">
        <i class="fas fa-sign-out-alt text-lg group-hover:rotate-180 transition-transform duration-300"></i>
      </span>
      ออกจากระบบ
    </a>
  </nav>
</div>

<script>
  // ให้เมนูฝั่งซ้ายเปลี่ยนแท็บเดียวกับปุ่มด้านบน (ที่สคริปต์หลักของคุณผูกไว้)
  (function () {
    const navLinks = document.querySelectorAll('[data-tab-nav]');
    navLinks.forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        const tab = link.dataset.tabNav;
        const headerBtn = document.querySelector(`[data-tab-btn="${tab}"]`);
        if (headerBtn) {
          headerBtn.click(); // เรียก logic เดิมในหน้า dashboard
        } else {
          // เผื่อไม่มีปุ่มด้านบน (fallback)
          const section = document.querySelector(`[data-tab="${tab}"]`);
          if (section) {
            document.querySelectorAll('[data-tab]').forEach(s => s.classList.add('hidden'));
            section.classList.remove('hidden');
          }
        }
      });
    });
  })();
</script>
