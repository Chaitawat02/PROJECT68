{% extends 'main/base.html' %}
{% load static %}

{% block title %}ตั้งรหัสผ่านใหม่{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-3xl shadow-lg border border-gray-100">
        <div class="text-center">
            <h2 class="mt-2 text-3xl font-extrabold text-gray-900">
                ตั้งรหัสผ่านใหม่
            </h2>
            <p class="mt-2 text-sm text-gray-600">
                กรุณากรอกรหัสผ่านใหม่ของคุณ
            </p>
        </div>

        <form class="mt-8 space-y-6" method="POST">
            {% csrf_token %}
            
            {% if messages %}
            <div class="space-y-2">
                {% for message in messages %}
                    <div class="p-4 rounded-xl text-sm font-medium
                        {% if message.tags == 'success' %} bg-green-50 text-green-700
                        {% elif message.tags == 'error' %} bg-red-50 text-red-700
                        {% else %} bg-blue-50 text-blue-700 {% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
            {% endif %}

            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">รหัสผ่านใหม่</label>
                    <input type="password" name="new_password" required minlength="8"
                        class="appearance-none rounded-xl relative block w-full px-4 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-amber-500 focus:border-amber-500 sm:text-sm" 
                        placeholder="รหัสผ่านใหม่ (อย่างน้อย 8 ตัวอักษร)">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">ยืนยันรหัสผ่านใหม่</label>
                    <input type="password" name="confirm_password" required minlength="8"
                        class="appearance-none rounded-xl relative block w-full px-4 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-amber-500 focus:border-amber-500 sm:text-sm" 
                        placeholder="กรอกรหัสผ่านเดิมอีกครั้ง">
                </div>
            </div>

            <div class="pt-4">
                <button type="submit" class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-xl text-white bg-amber-800 hover:bg-amber-900 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-amber-500 transition-all shadow-md hover:shadow-lg">
                    <span class="absolute left-0 inset-y-0 flex items-center pl-3">
                        <i class="fas fa-save text-amber-500 group-hover:text-amber-400"></i>
                    </span>
                    บันทึกรหัสผ่าน
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
