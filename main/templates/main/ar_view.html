{% load static %}
<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Smart Silk Mirror - Virtual Fitting</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Prompt:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    /* ===== THEME VARIABLES ===== */
    :root {
      --gold-primary: #D4AF37;
      --gold-soft: #F3E5AB;
      --navy-deep: #1B2631;
      --text-dark: #2C3E50;
      --text-light: #7F8C8D;
      --bg-color: #FAFAFA;
      --glass-panel: rgba(255, 255, 255, 0.9);
      --glass-border: rgba(255, 255, 255, 0.5);
      --shadow-soft: 0 10px 40px rgba(0,0,0,0.08);
      --radius-large: 24px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      background-color: var(--bg-color);
      background-image: radial-gradient(#e0e0e0 1px, transparent 1px);
      background-size: 20px 20px;
      font-family: 'Prompt', sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* ===== LOADING SCREEN ===== */
    #app-loader {
      position: fixed; inset: 0;
      background: #fff;
      z-index: 9999;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      transition: opacity 0.5s ease;
    }
    .loader-spinner {
      width: 50px; height: 50px;
      border: 3px solid rgba(212, 175, 55, 0.3);
      border-radius: 50%;
      border-top-color: var(--gold-primary);
      animation: spin 1s ease-in-out infinite;
      margin-bottom: 20px;
    }
    .loader-text {
      font-family: 'Cormorant Garamond', serif;
      color: var(--navy-deep);
      font-size: 1.5rem;
      letter-spacing: 2px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== MAIN LAYOUT ===== */
    .main-grid {
      width: 95%; max-width: 1600px;
      height: 90vh;
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 30px;
    }

    /* ===== LEFT: AR MIRROR (FIXED) ===== */
    .mirror-container {
      position: relative;
      /* [FIX] เปลี่ยนจากสีดำเป็นโปร่งใส เพื่อให้เห็นกล้อง */
      background: transparent; 
      /* ใส่สีเทาจางๆ ไว้รองหลังเผื่อกล้องมาช้า */
      background-color: #f0f0f0; 
      
      border-radius: var(--radius-large);
      overflow: hidden;
      box-shadow: var(--shadow-soft);
      border: 8px solid #fff;
      box-shadow: 0 20px 50px rgba(0,0,0,0.15), inset 0 0 60px rgba(0,0,0,0.5);
    }

    .mirror-container::after {
      content: ''; position: absolute; inset: 15px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 18px;
      pointer-events: none; z-index: 50;
    }

    /* AR Elements Positioning */
    #ar-root {
      width: 100%; height: 100%;
      position: relative;
    }

    /* [FIX] บังคับให้ Video แสดงผลและอยู่ถูก Layer (mirror by default) */
    #ar-root video {
      position: absolute !important;
      top: 0 !important; left: 0 !important;
      width: 100% !important; height: 100% !important;
      object-fit: cover !important;
      transform: scaleX(-1) !important; /* Mirror Effect for front camera */
      
      /* Layering */
      z-index: 1 !important; 
      
      /* Visibility Force */
      display: block !important;
      opacity: 1 !important;
      visibility: visible !important;
    }

    /* [FIX] ให้ Canvas (โมเดล 3D) อยู่ทับบนกล้อง */
    #ar-root canvas {
      position: absolute !important; 
      top: 0 !important; left: 0 !important;
      width: 100% !important; height: 100% !important;
      transform: scaleX(-1) !important;
      
      z-index: 10 !important; /* เหนือ Video */
      pointer-events: none;
    }

    /* When using back camera, cancel mirror effect */
    body.no-mirror #ar-root video,
    body.no-mirror #ar-root canvas {
      transform: scaleX(1) !important;
    }

    /* Status Pill */
    .status-pill {
      position: absolute; top: 30px; left: 30px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      padding: 8px 16px;
      border-radius: 50px;
      display: flex; align-items: center; gap: 8px;
      z-index: 60;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .status-dot {
      width: 8px; height: 8px;
      background-color: #2ecc71;
      border-radius: 50%;
      box-shadow: 0 0 10px #2ecc71;
    }
    .status-text { color: #fff; font-size: 0.8rem; font-weight: 300; }

    /* Camera toggle button (always visible on mirror) */
    .camera-toggle-btn {
      position: absolute;
      top: 30px; right: 30px;
      z-index: 60;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.4);
      background: rgba(0,0,0,0.6);
      color: #fff;
      font-size: 0.75rem;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .camera-toggle-btn:hover {
      background: rgba(0,0,0,0.8);
    }
    .camera-toggle-btn-icon {
      width: 16px; height: 16px;
      border-radius: 999px;
      border: 2px solid #fff;
      position: relative;
    }
    .camera-toggle-btn-icon::after {
      content: '';
      position: absolute;
      inset: 3px;
      border-radius: inherit;
      border-top: 2px solid #fff;
    }

    /* Back to home button (overlay, independent from panels) */
    .back-home-btn {
      position: absolute;
      left: 30px;
      bottom: 30px;
      z-index: 60;
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.4);
      background: rgba(0,0,0,0.6);
      color: #fff;
      font-size: 0.75rem;
      letter-spacing: 0.5px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }
    .back-home-btn:hover { background: rgba(0,0,0,0.8); }
    .back-home-icon {
      width: 18px;
      height: 18px;
      display: inline-block;
      border-radius: 999px;
      border: 2px solid #fff;
      position: relative;
      opacity: 0.95;
    }
    .back-home-icon::before {
      content: '';
      position: absolute;
      left: 5px;
      top: 5px;
      width: 6px;
      height: 6px;
      border-left: 2px solid #fff;
      border-bottom: 2px solid #fff;
      transform: rotate(45deg);
    }

    /* ===== RIGHT: INFO PANEL ===== */
    .info-panel {
      background: var(--glass-panel);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: var(--radius-large);
      border: 1px solid #fff;
      padding: 60px 40px;
      display: flex; flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: var(--shadow-soft);
      position: relative;
      max-height: 100%;
      overflow-y: auto;
    }

    .brand-header { margin-bottom: 40px; }
    .brand-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 3rem;
      margin: 0;
      color: var(--navy-deep);
      line-height: 1;
    }
    .brand-sub {
      color: var(--gold-primary);
      text-transform: uppercase;
      letter-spacing: 4px;
      font-size: 0.85rem;
      margin-top: 10px;
      font-weight: 600;
    }

    .product-showcase {
      flex: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      width: 100%;
    }

    .swatch-wrapper {
      position: relative;
      width: 260px; height: 260px;
      margin-bottom: 30px;
    }
    .swatch-img {
      width: 100%; height: 100%;
      object-fit: cover;
      border-radius: 4px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      border: 6px solid #fff;
      transform: rotate(-3deg);
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .swatch-wrapper:hover .swatch-img { transform: rotate(0deg) scale(1.05); }

    .product-details h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.5rem;
      color: var(--navy-deep);
      margin: 0 0 10px 0;
    }
    .product-details p {
      color: var(--text-light);
      line-height: 1.6;
      font-weight: 300;
      max-width: 80%;
      margin: 0 auto;
    }

    /* รายการรายละเอียดลายผ้าหลังสแกน AR */
    .meta-list {
      max-width: 90%;
      margin: 14px auto 0;
      color: var(--text-dark);
      padding: 12px 14px;
      border-radius: 16px;
      border: 1px solid rgba(212, 175, 55, 0.22);
      background: rgba(255, 255, 255, 0.78);
    }
    .meta-row {
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: 2px 10px;
      padding: 6px 0;
      font-size: 0.9rem;
      border-bottom: 1px dashed rgba(127, 140, 141, 0.25);
    }
    .meta-row:last-child { border-bottom: 0; }
    .meta-label {
      font-weight: 600;
      color: var(--text-light);
      white-space: nowrap;
    }
    .meta-value {
      color: var(--text-dark);
      overflow-wrap: anywhere;
    }
    .meta-block {
      margin-top: 10px;
      font-size: 0.9rem;
      padding-top: 10px;
      border-top: 1px dashed rgba(127, 140, 141, 0.25);
    }
    .meta-preline { white-space: pre-line; line-height: 1.55; margin-top: 6px; }

    .btn-refresh {
      background: transparent;
      border: 1px solid var(--navy-deep);
      color: var(--navy-deep);
      padding: 12px 30px;
      border-radius: 50px;
      font-family: 'Prompt', sans-serif;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: auto;
      text-transform: uppercase;
      font-size: 0.8rem;
      letter-spacing: 1px;
    }
    .btn-refresh:hover {
      background: var(--navy-deep);
      color: #fff;
      box-shadow: 0 10px 20px rgba(27, 38, 49, 0.2);
    }

    /* Target file selector */
    .target-picker {
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      background: rgba(255, 255, 255, 0.65);
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }
    /* ซ่อน UI เลือกไฟล์ Target (ยังคงไว้ให้ระบบ auto-cycle ใช้งานใน DOM) */
    .target-picker.is-hidden { display: none; }
    .target-picker-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 1px;
      color: var(--text-light);
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .target-picker-select {
      width: 100%;
      border-radius: 12px;
      border: 1px solid rgba(212, 175, 55, 0.25);
      background: rgba(255,255,255,0.9);
      padding: 10px 12px;
      font-family: 'Prompt', sans-serif;
      color: var(--text-dark);
      outline: none;
    }
    .target-picker-select:focus {
      border-color: rgba(212, 175, 55, 0.65);
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.18);
    }
    .target-picker-hint {
      margin-top: 6px;
      font-size: 0.75rem;
      color: var(--text-light);
    }

    .mindar-ui-overlay {
        display: none !important;
        opacity: 0 !important;
        pointer-events: none !important;
    }

    @media (max-width: 900px) {
      /* Mobile: แยกกล้องกับแผงข้อมูล ไม่ให้ทับกัน */
      body {
        align-items: flex-start;
        background: #000;
        overflow-y: auto;
      }
      
      .main-grid {
        display: block;
        width: 100%;
        height: auto;
        margin: 0;
        border-radius: 0;
      }

      .mirror-container {
        width: 100%;
        height: 72vh;
        border-radius: 0;
        border: none;
        box-shadow: none;
        background: #000; /* พื้นหลังรองเมื่อกล้องยังไม่พร้อม */
      }
      .mirror-container::after { display: none; }
      
      .info-panel {
        position: relative;
        bottom: auto; left: auto; right: auto;
        height: auto;
        min-height: 220px;
        border-radius: 0 0 25px 25px;
        padding: 24px;
        background: rgba(255, 255, 255, 0.97);
        justify-content: flex-start;
        align-items: flex-start;
        z-index: 1;
      }

      .brand-header { display: none; }
      
      .product-showcase {
        flex-direction: row;
        align-items: center;
        width: 100%;
        gap: 20px;
        justify-content: flex-start;
      }

      .swatch-wrapper {
        width: 80px; height: 80px;
        margin-bottom: 0;
        flex-shrink: 0;
      }
      .swatch-img { border-width: 2px; transform: rotate(0); }

      .product-details { text-align: left; }
      .product-details h2 { font-size: 1.5rem; margin-bottom: 5px; }
      .product-details p { font-size: 0.9rem; margin: 0; max-width: 100%; }

      .btn-refresh {
        position: static;
        margin-top: 12px;
        padding: 8px 18px;
        font-size: 0.75rem;
      }

      .camera-toggle-btn {
        top: 16px;
        right: 16px;
        padding: 6px 10px;
        font-size: 0.7rem;
      }

      .back-home-btn {
        left: 16px;
        bottom: 16px;
        padding: 8px 12px;
        font-size: 0.7rem;
      }
    }
  </style>

  <script async src="https://unpkg.com/es-module-shims@1.7.3/dist/es-module-shims.js"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.147.0/examples/jsm/",
      "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
    }
  }
  </script>
</head>

<body>

  <div id="app-loader">
    <div class="loader-spinner"></div>
    <div class="loader-text">SMART SILK</div>
  </div>

  <div class="main-grid">
    
    <div class="mirror-container">
      <div class="status-pill">
        <div class="status-dot"></div>
        <span class="status-text" id="status-text">Ready to Scan</span>
      </div>

      <a class="back-home-btn" href="{% url 'home' %}" aria-label="กลับไปหน้าหลัก">
        <span class="back-home-icon" aria-hidden="true"></span>
        <span>กลับหน้าหลัก</span>
      </a>

      <button type="button" class="camera-toggle-btn" onclick="toggleCamera()">
        <span class="camera-toggle-btn-icon"></span>
        <span>สลับกล้อง</span>
      </button>

      <div id="ar-root" 
           data-target-src="{{ target_file_url }}" 
           data-model-base="{% static 'main/models/' %}">
      </div>
    </div>

    <div class="info-panel">
      <div class="brand-header">
        <h1 class="brand-title">Smart Silk</h1>
        <div class="brand-sub">Virtual Fitting Room</div>

        {% if mind_files %}
        <div class="target-picker is-hidden" aria-label="เลือกไฟล์ Target (.mind)">
          <label class="target-picker-label" for="mindSelect">Target File</label>
          <select id="mindSelect" class="target-picker-select">
            {% for f in mind_files %}
              <option value="{{ f }}" {% if chosen_target == f %}selected{% endif %}>{{ f }}</option>
            {% endfor %}
          </select>
          <div class="target-picker-hint">สลับไฟล์แล้วหน้าจะรีโหลดเพื่อเริ่มสแกนใหม่</div>
        </div>
        {% endif %}
      </div>

      <div class="product-showcase">
        <div class="swatch-wrapper">
          <img id="panel-image" class="swatch-img" 
               src="https://placehold.co/400x400/EEE/999?text=SCAN+FABRIC" 
               alt="Silk Pattern">
        </div>

        <div class="product-details">
          <h2 id="panel-name">กรุณาสแกนลายผ้า</h2>
          <p id="panel-sub">
            นำการ์ดลายผ้าไหมมาส่องที่หน้ากระจก<br>เพื่อทดลองทาบลงบนตัวคุณ
          </p>
          <!-- รายละเอียดลายผ้าหลังจากสแกน AR -->
          <div id="panel-meta" class="mt-4 text-sm text-left meta-list hidden">
            <!-- จะถูกเติมข้อมูลด้วย JavaScript -->
          </div>
        </div>
      </div>

      <button class="btn-refresh" onclick="window.location.reload()">
        Reset Camera
      </button>

      <button class="btn-refresh" style="margin-top: 10px;" onclick="toggleCamera()">
        Switch Front / Back
      </button>
    </div>

  </div>

  <script id="patterns-data" type="application/json">
    {{ patterns_json|safe }}
  </script>

  <script id="targets-url" type="application/json">
    "{% if target_file_url %}{{ target_file_url }}{% else %}{% static 'main/targets/targets0.mind' %}{% endif %}"
  </script>

  <script type="module" src="{% static 'main/ar_test.js' %}?v={% now 'U' %}" onerror="alert('Failed to load Main AR Script')"></script>

  <script>
    // 1. Hide Loader when camera is likely ready (Timeout fallback)
    window.addEventListener('load', () => {
      setTimeout(() => {
        const loader = document.getElementById('app-loader');
        if(loader) {
            loader.style.opacity = '0';
            setTimeout(() => loader.remove(), 500);
        }
      }, 4000); 
    });

    // 2. Global Error Reporting
    window.onerror = function(msg, url, line) {
       console.error("Global Error:", msg);
       try { window.__arStartFailed = true; } catch (e) {}
       const status = document.getElementById('status-text');
       if(status) {
         status.textContent = "System Alert";
         status.style.color = "#ff6b6b";
       }
    };

    // 3. Toggle front/back camera by reloading with query param
    function toggleCamera() {
      const url = new URL(window.location.href);
      const current = url.searchParams.get('cam');
      const next = (current === 'environment' || current === 'back') ? 'user' : 'environment';
      url.searchParams.set('cam', next);
      window.location.href = url.toString();
    }

    // 4. Switch mind target file (.mind) and restart AR
    (function bindMindPicker(){
      const sel = document.getElementById('mindSelect');
      if (!sel) return;
      sel.addEventListener('change', function(){
        const url = new URL(window.location.href);
        // reset auto state when user explicitly picks
        try { sessionStorage.removeItem('ar_auto_idx'); } catch (e) {}
        url.searchParams.set('mind', sel.value);
        window.location.href = url.toString();
      });
    })();

    // 5. Auto mode for users who don't know which targets file to pick
    // - If no ?mind=... is specified, use last successful mind file (localStorage)
    // - If still not detected after a timeout, cycle through other .mind files automatically (loop forever)
    (function autoMindMode(){
      const sel = document.getElementById('mindSelect');
      if (!sel) return; // only when we have multiple mind files listed

      const url = new URL(window.location.href);
      const params = url.searchParams;
      const explicitMind = params.get('mind');

      const files = Array.from(sel.options).map(o => (o.value || '').trim()).filter(Boolean);
      if (files.length <= 1) return;

      // Use last successful mind file when user didn't explicitly choose
      if (!explicitMind) {
        try {
          const last = (localStorage.getItem('ar_last_mind') || '').trim();
          if (last && files.includes(last) && sel.value !== last) {
            params.set('mind', last);
            window.location.href = url.toString();
            return;
          }
        } catch (e) {
          // ignore
        }
      }

      // Auto-cycle when not detected
      const status = document.getElementById('status-text');
      const currentMind = (explicitMind || sel.value || '').trim();

      // Continuous cycling logic:
      // - initial load: wait a bit on current file
      // - after target is lost: switch sooner to find the next cloth quickly
      const INITIAL_TRY_MS = 6000;
      const AFTER_LOST_TRY_MS = 4500;
      const CHECK_EVERY_MS = 800;
      const MIN_SWITCH_GAP_MS = 1200;

      const normalizeIndex = (idx) => {
        const n = files.length;
        if (!n) return 0;
        const v = Number(idx);
        if (!Number.isFinite(v)) return 0;
        return ((v % n) + n) % n;
      };

      const currentIdx = (() => {
        const idxFromMind = currentMind ? files.indexOf(currentMind) : -1;
        if (idxFromMind >= 0) return idxFromMind;
        // optional: allow session to carry idx (helps when mind param missing)
        try {
          const stored = sessionStorage.getItem('ar_auto_idx');
          if (stored !== null) return normalizeIndex(stored);
        } catch (e) {}
        return 0;
      })();

      // Keep a friendly message while searching
      if (status && !window.__arDetected) {
        status.textContent = 'กำลังค้นหาลายผ้า... รอหน่อยนะ';
      }

      const readNumber = (key, fallback = 0) => {
        try {
          const v = sessionStorage.getItem(key);
          const n = Number(v);
          return Number.isFinite(n) ? n : fallback;
        } catch (e) {
          return fallback;
        }
      };
      const writeNumber = (key, value) => {
        try { sessionStorage.setItem(key, String(value)); } catch (e) {}
      };

      // Per-attempt timer: reset on every page load so each .mind gets a fair try window
      const attemptStartedAt = Date.now();

      const switchToIdx = (idx) => {
        const nextIdx = normalizeIndex(idx);
        const next = files[nextIdx];
        if (!next) return;

        writeNumber('ar_auto_idx', nextIdx);
        writeNumber('ar_auto_last_switch_at', Date.now());

        if (status) status.textContent = 'รอหน่อยนะ...กำลังลองข้อมูลอื่นให้';

        const nextUrl = new URL(window.location.href);
        nextUrl.searchParams.set('mind', next);
        window.location.href = nextUrl.toString();
      };

      // If URL mind doesn't match stored index, align stored index with current mind
      if (currentMind) {
        const idxFromMind = files.indexOf(currentMind);
        if (idxFromMind >= 0) writeNumber('ar_auto_idx', idxFromMind);
      }

      window.setInterval(() => {
        if (window.__arStartFailed) return;
        if (window.__arDetected) return;

        const now = Date.now();
        const lastSwitchAt = readNumber('ar_auto_last_switch_at', 0);
        if (now - lastSwitchAt < MIN_SWITCH_GAP_MS) return;

        const lostAt = Number(window.__arLostAt || 0);
        const sinceLost = lostAt ? (now - lostAt) : null;
        const sinceAttempt = now - attemptStartedAt;

        const waitMs = (sinceLost !== null) ? AFTER_LOST_TRY_MS : INITIAL_TRY_MS;
        const elapsed = (sinceLost !== null) ? sinceLost : sinceAttempt;

        if (elapsed < waitMs) {
          if (status) status.textContent = 'กำลังค้นหาลายผ้า... รอหน่อยนะ';
          return;
        }

        const idx = normalizeIndex(readNumber('ar_auto_idx', currentIdx));
        const nextIdx = normalizeIndex(idx + 1);
        switchToIdx(nextIdx);
      }, CHECK_EVERY_MS);
    })();
  </script>

</body>
</html>
